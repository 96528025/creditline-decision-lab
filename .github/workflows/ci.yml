name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    name: Offline tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The Kaggle file is not committed, so the tests that read data/raw/cs-training.csv
      # skip here; everything that runs against the committed artifacts must pass.
      - name: Run the default test suite
        run: python -m pytest -q -rs
